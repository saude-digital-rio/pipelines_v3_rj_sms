# =============================================================================
# ABORDAGEM ALTERNATIVA: availableSecrets
# =============================================================================
#
# Este arquivo é uma versão comentada e NÃO UTILIZADA do cloudbuild.yaml,
# ilustrando como seria a implementação usando availableSecrets ao invés da
# abordagem atual com export + gcloud secrets.
#
# -----------------------------------------------------------------------------
# COMPARAÇÃO DAS DUAS ABORDAGENS
# -----------------------------------------------------------------------------
#
# 1) ABORDAGEM ATUAL: export + gcloud secrets (cloudbuild.yaml)
#
#    - Os nomes dos secrets NÃO são hardcoded no YAML. Em vez disso, o Trigger
#      define variáveis de substituição (_SECRET_*) com os nomes dos secrets,
#      permitindo que diferentes Triggers apontem para secrets diferentes sem
#      alterar o código.
#    - O valor do secret passa pelo shell do bash: é lido com `gcloud secrets
#      versions access` e atribuído a uma variável com `export`. O valor existe
#      na memória do processo bash antes de ser herdado pelo processo filho
#      (uv run python ...).
#    - O valor NÃO aparece em logs desde que não haja `echo`, `set -x` ou
#      qualquer outro comando que o imprima explicitamente.
#
# 2) ESTA ABORDAGEM: availableSecrets
#
#    - Os nomes dos secrets SÃO hardcoded no YAML (versionName). Não é possível
#      parametrizá-los via variáveis de substituição do Trigger.
#    - O Cloud Build injeta os valores diretamente como variáveis de ambiente
#      do container, sem que o shell os veja em nenhum momento. É o equivalente
#      exato ao bloco `env:` do GitHub Actions.
#    - Os valores são automaticamente mascarados nos logs do Cloud Build:
#      qualquer ocorrência do valor nos logs é substituída por "***".
#
# -----------------------------------------------------------------------------
# RISCOS EM AMBAS AS ABORDAGENS
# -----------------------------------------------------------------------------
#
# Risco 1 — Exposição passiva via logs (agente com acesso de leitura aos logs):
#   - export + gcloud secrets: risco existe se houver `echo`, `set -x` ou log
#     acidental do valor em algum script. Sem isso, o risco é desprezível.
#   - availableSecrets: risco mitigado pelo mascaramento automático do Cloud
#     Build. Ainda assim, um script Python que loga a variável antes do
#     mascaramento entrar em ação pode expor o valor.
#   Vantagem: availableSecrets.
#
# Risco 2 — Exfiltração ativa (agente com acesso de escrita ao repositório):
#   - Em AMBAS as abordagens, um agente malicioso com acesso para editar o
#     repositório pode adicionar um `print(os.getenv("PREFECT_API_KEY"))` no
#     script Python ou um `echo $PREFECT_API_KEY` no YAML e obter o valor nos
#     logs. O fato de o valor passar ou não pelo shell é irrelevante neste caso.
#   - A proteção aqui é de processo, não técnica: branch protection com
#     revisão obrigatória de PRs, restrição do Trigger para rodar apenas em
#     branches protegidas, e controle de quem pode aprovar merges.
#   Vantagem: nenhuma das duas — são equivalentes.
#
# -----------------------------------------------------------------------------
# CONCLUSÃO
# -----------------------------------------------------------------------------
#
# availableSecrets é tecnicamente superior para proteção passiva (logs), mas
# exige hardcode dos nomes dos secrets no YAML, o que reduz flexibilidade.
# A abordagem atual com export + gcloud secrets foi escolhida justamente para
# permitir que o Trigger defina quais secrets usar sem alterar o código.
# Para o risco mais relevante na prática (agente com acesso ao repositório),
# as duas abordagens oferecem a mesma proteção — nenhuma.
#
# =============================================================================

steps:
  # Com availableSecrets, não há step separado para buscar os secrets.
  # O Cloud Build os injeta diretamente no container de cada step que declarar
  # `secretEnv`, sem intermediação do shell.
  - name: 'python:3.13'
    entrypoint: 'bash'
    # secretEnv declara quais das variáveis definidas em availableSecrets este
    # step deve receber. O Cloud Build injeta os valores como variáveis de
    # ambiente do container antes de o entrypoint ser executado.
    secretEnv:
      - GOOGLE_CREDENTIALS
      - INFISICAL_ADDRESS
      - INFISICAL_PROJECT_ID
      - INFISICAL_TOKEN
      - PAT_QUERIES
      - PREFECT_API_KEY
      - PREFECT_API_URL
      - PREFECT_WS_AUTH
    args:
      - '-c'
      - |
        set -e

        # Não há `export` aqui. As variáveis já estão disponíveis no ambiente
        # do container e são herdadas diretamente pelo processo Python via
        # os.getenv(), sem passar pelo shell.
        pip install uv --quiet
        uv sync --all-packages
        uv run python .github/scripts/deploy_prefect_flows.py

# Os nomes dos secrets precisam ser hardcoded aqui com o caminho completo no
# Secret Manager. Não é possível usar variáveis de substituição do Trigger
# (_SECRET_*) neste bloco — essa é a principal limitação do availableSecrets
# em relação à abordagem atual.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/NOME_DO_SECRET_GOOGLE_CREDENTIALS/versions/latest
      env: GOOGLE_CREDENTIALS
    - versionName: projects/$PROJECT_ID/secrets/NOME_DO_SECRET_INFISICAL_ADDRESS/versions/latest
      env: INFISICAL_ADDRESS
    - versionName: projects/$PROJECT_ID/secrets/NOME_DO_SECRET_INFISICAL_PROJECT_ID/versions/latest
      env: INFISICAL_PROJECT_ID
    - versionName: projects/$PROJECT_ID/secrets/NOME_DO_SECRET_INFISICAL_TOKEN/versions/latest
      env: INFISICAL_TOKEN
    - versionName: projects/$PROJECT_ID/secrets/NOME_DO_SECRET_PAT_QUERIES/versions/latest
      env: PAT_QUERIES
    - versionName: projects/$PROJECT_ID/secrets/NOME_DO_SECRET_PREFECT_API_KEY/versions/latest
      env: PREFECT_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/NOME_DO_SECRET_PREFECT_API_URL/versions/latest
      env: PREFECT_API_URL
    - versionName: projects/$PROJECT_ID/secrets/NOME_DO_SECRET_PREFECT_WS_AUTH/versions/latest
      env: PREFECT_WS_AUTH

options:
  logging: CLOUD_LOGGING_ONLY
